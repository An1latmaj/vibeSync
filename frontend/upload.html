<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload History - VibeSync</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">VibeSync</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#features">Features</a></li>
                <li><a href="upload.html" class="btn-small active">Get Started</a></li>
            </ul>
        </nav>
    </header>

    <section class="upload-container">
        <h1>Upload Your Spotify History</h1>
        <p class="upload-intro">Upload your Spotify listening history JSON files to start analyzing your music journey.</p>

        <div class="upload-form">
            <div class="form-group">
                <label for="username">Username (required)</label>
                <input type="text" id="username" placeholder="Enter a username (1-15 characters)" maxlength="15" required>
            </div>

            <div class="form-group">
                <label for="file-upload">Upload Spotify JSON Files</label>
                <div class="file-upload-area" id="drop-area">
                    <input type="file" id="file-upload" multiple accept=".json" hidden>
                    <div class="upload-prompt">
                        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <p>Drag & drop files here or <span class="browse-link">browse</span></p>
                    </div>
                </div>
                <div class="file-list" id="file-list"></div>
            </div>

            <button id="upload-btn" class="btn-large">Upload Files</button>
        </div>

        <div class="upload-status" id="upload-status" style="display: none;">
            <div class="status-indicator">
                <div class="loader"></div>
                <h3 id="status-message">Processing your files...</h3>
                <p id="status-details"></p>
            </div>
            <a href="#" id="go-to-dashboard" class="btn-large" style="display: none;">View Results</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 VibeSync. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
